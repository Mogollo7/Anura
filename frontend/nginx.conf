server {
    listen 80;
    server_name localhost;

    # Docker DNS: resolve upstreams at request time so missing
    # services (p.ej. model-service) no impiden arrancar nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # model-service (docker-compose.model.yml) no está en esta red: se alcanza por
    # MODEL_SERVICE_URL. Este archivo es una plantilla; la imagen oficial de nginx
    # sustituye ${MODEL_SERVICE_URL} y ${MODEL_SERVICE_TOKEN} al arrancar.
    # Sin "Host $host": un túnel de Cloudflare enruta por el nombre del destino.
    location /api/predict {
        set $model_service ${MODEL_SERVICE_URL};
        proxy_pass $model_service;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header X-Model-Token "${MODEL_SERVICE_TOKEN}";
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }

    location /api/ai {
        set $model_service ${MODEL_SERVICE_URL};
        proxy_pass $model_service;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header X-Model-Token "${MODEL_SERVICE_TOKEN}";
    }

    location /api/auth {
        set $upstream_auth auth-service:3001;
        proxy_pass http://$upstream_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/preferences {
        set $upstream_auth auth-service:3001;
        proxy_pass http://$upstream_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/panel {
        set $upstream_auth auth-service:3001;
        proxy_pass http://$upstream_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/observations {
        set $upstream_obs observation-service:3002;
        proxy_pass http://$upstream_obs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 25m;
    }

    location /api/obs {
        set $upstream_obs observation-service:3002;
        proxy_pass http://$upstream_obs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/geo {
        set $upstream_geo geo-service:3003;
        proxy_pass http://$upstream_geo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/thumbnails {
        set $upstream_thumb thumbnail-service:3004;
        proxy_pass http://$upstream_thumb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/explorer {
        set $upstream_explorer explorer-service:3005;
        proxy_pass http://$upstream_explorer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Solo el catálogo público de contenido (K): fichas publicadas y sus fotos CC. El resto
    # de /api/dataset es del Admin y no pasa por aquí.
    location /api/dataset/publico/ {
        set $upstream_dataset dataset-service:3008;
        proxy_pass http://$upstream_dataset;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # El worker de IA (model-service, en la GPU de este PC) pide trabajos por aquí a través del
    # túnel. Solo entra con el header X-Worker-Token (dataset-service lo compara y, sin token
    # configurado, responde 401 siempre). Los lotes de vectores pueden pesar varios MB.
    location /api/worker/ {
        set $upstream_dataset dataset-service:3008;
        proxy_pass http://$upstream_dataset;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 25m;
        proxy_read_timeout 120s;
    }

    # Fotos del dataset para el Admin: URLs prefirmadas por dataset-service contra
    # MINIO_PUBLIC_ENDPOINT. La firma incluye el host, así que se conserva tal cual. El bucket
    # es privado: sin firma válida MinIO responde 403. Solo lectura.
    location /anura-dataset/ {
        set $upstream_minio minio:9000;
        proxy_pass http://$upstream_minio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        limit_except GET HEAD {
            deny all;
        }
    }

    location /api/notifications {
        set $upstream_notif notification-service:3006;
        proxy_pass http://$upstream_notif;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/validation {
        set $upstream_validation validation-service:3007;
        proxy_pass http://$upstream_validation;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
