# Arranque de todos los días:  .\scripts\up.ps1
#   docker compose up -d
# El modelo de GPU no entra en ese arranque (tarda y, si falla, deja el resto a medias).
# Para incluirlo:  .\scripts\up.ps1 -Model
#                  docker compose --profile model up -d
name: anura
include:
  - docker-compose.server.yml
  - docker-compose.model.yml
